# Copy to config.toml and edit for your board.
#
#     cp config.example.toml config.toml
#
# config.toml is gitignored, because GPIO offsets and ALSA device names are
# specific to one physical robot.

# Everything below resolves relative to this directory unless given as an
# absolute path.
base_dir = "/home/radxa/travel_assistant"

# "CITY" or "TRANSLATE"
default_mode = "CITY"


[audio]
# 16 kHz is what the Vosk small model expects. Changing it degrades accuracy.
sample_rate = 16000
# Frames per read. 4000 frames = 250 ms. Larger is more latency, smaller costs
# more CPU wake-ups. This is also the PortAudio buffer size.
block_frames = 4000
channels = 1
# PortAudio input index. Leave unset for the default; find yours with
#     python3 -c "import pyaudio;p=pyaudio.PyAudio();[print(i,p.get_device_info_by_index(i)['name']) for i in range(p.get_device_count())]"
# input_device = 1
# ALSA output for the MAX98357A. "default" works once the I2S card is the only
# one; otherwise use the plughw name from `aplay -l`.
playback_device = "default"


[speech]
model_path = "models_stt/vosk-model-small-en-us-0.15"
# Leave empty for always-on listening. Set a wake phrase if the robot lives
# somewhere with background conversation:
# wake_words = ["hey wally", "wall e"]
wake_words = []


[tts]
# Path to the Piper executable, or just "piper" if it is on PATH.
binary = "piper"
voices_dir = "models_tts"
# Used only if a voice's .onnx.json sidecar cannot be read.
fallback_sample_rate = 22050

[tts.voices]
# Voice names come from https://huggingface.co/rhasspy/piper-voices and encode
# a locale and a quality tier. They cannot be derived from a bare language code.
en = "models_tts/en_US-lessac-medium.onnx"
es = "models_tts/es_ES-davefx-medium.onnx"
# fr = "models_tts/fr_FR-siwis-medium.onnx"
# de = "models_tts/de_DE-thorsten-medium.onnx"


[translate]
source_lang = "en"
target_lang = "es"


# --- Verified against Radxa's 40-pin table for the Cubie A7Z ---------------
#   https://docs.radxa.com/en/cubie/a7z/hardware-use/pin-gpio
#
#   I2S   pin 12  PB5   BCLK   shared by the microphone and the amplifier
#         pin 35  PB6   LRCK   shared by the microphone and the amplifier
#         pin 38  PB8   DIN0   microphone data into the board
#         pin 40  PB7   DOUT0  board data out to the amplifier
#         pin 36  PB4   MCLK   unused; neither INMP441 nor MAX98357A needs it
#
#   SPI1  pin 19  PD12  MOSI   screen SDA
#         pin 23  PD11  CLK    screen SCK
#         pin 24  PD10  CS0    screen CS
#         pin 21  PD13  MISO   unused by the screen
#
#   Spare pins for the screen's control lines:
#         pin 22  PL5          screen DC
#         pin 18  PJ25         screen RST
#
#   GPIO numbers are NUM + 32 * letter-index, with A=0 inside gpiochip0 and
#   L=0 inside gpiochip1. PD12 is 12 + 32*3 = 108 on gpiochip0; PL5 is 5 on
#   gpiochip1. Confirm against `gpioinfo` before trusting any of it.

[display]
# The screen is driven as a Linux framebuffer, not from Python over SPI. That
# means the panel is bound by a device tree overlay - which is where the SPI
# and DC/RST pins above are configured - and this program simply writes pixels
# to the device the overlay creates.
enabled = true

# /dev/fb1 for an SPI panel bound through fbtft, /dev/fb0 for HDMI. Geometry is
# read from sysfs, so there is nothing to set here beyond the device itself.
device = "/dev/fb1"

# Some ILI9341 boards are wired big-endian. If the face renders in the wrong
# colours, flip this before suspecting the wiring.
swap_bytes = false

# Silence before the eyes close. Also the point at which it visibly stops
# listening, which is worth being able to see across a room.
sleep_after_s = 120.0

# How long a map or an information card stays up before the face returns.
card_seconds = 6.0


[camera]
# The eye. It captures ONE still when you ask it to look, and at no other
# time - there is no background stream and no motion trigger. A microphone
# that is always listening is what a voice assistant is; a camera that is
# always watching is a different thing to have in a room.
enabled = true

# A USB webcam is far and away the easiest option: plug it in, done. A ribbon
# (CSI) camera also works, and the capture tool for it ignores this setting.
device = "/dev/video0"
width = 1024
height = 768

# Some USB webcams hand back a black first frame. Try 0.5 if yours does.
warmup_s = 0.0

# Off by default. Photographs are sent to the model and dropped, not
# collected. Turn on only if you actually want a folder of them.
save_captures = false
capture_dir = "captures"


[guides]
# Travel guides fetched from Gemini and kept on the card. This is what makes
# the online half worth having: every city you ask about with signal is still
# there when you have none.
enabled = true

# Their own database file, separate from world_cities.db. That means "delete
# everything I saved" is one file, and can never damage the cities database
# the robot needs to work.
database = "travel_guides.db"

# Fetch and keep a full guide the first time a city is asked about while
# online. Set false to only save when you explicitly ask for a guide.
auto_save = true

# Oldest guides are dropped past this. At a few kilobytes each it is a
# housekeeping limit, not a space one.
max_guides = 200

# A guide older than this is refetched when online, and read back with an
# "it may be out of date" warning when offline.
refresh_after_days = 90

# Also pull the map tiles for the city while saving, so the map works offline
# as well as the words.
save_map_tiles = true


[online]
# The hybrid half. With a key and a connection, Gemini answers city questions
# and translations; without either, the local models answer and the robot
# behaves identically apart from less detail. Motion and shutdown commands are
# never sent upstream.
enabled = true
provider = "gemini"

# The key is read from this environment variable, never from this file, so it
# cannot be committed alongside your GPIO offsets. Get a free key at
# https://aistudio.google.com/apikey then either export it:
#     export GEMINI_API_KEY=...
# or add it to the systemd unit as an EnvironmentFile.
api_key_env = "GEMINI_API_KEY"

# Free-tier model names change. Check https://ai.google.dev/gemini-api/docs/models
# before assuming this one is still current.
model = "gemini-2.5-flash"

# Short on purpose: the robot stands there silent while this runs, and a local
# answer now beats a better answer in fifteen seconds.
timeout_s = 6.0
# After a rate limit or server error, stop calling the API for this long and
# answer locally instead of retrying into the limit.
cooldown_s = 60.0

temperature = 0.4
max_output_tokens = 160


[city]
database = "world_cities.db"
# Longest place name the utterance scanner will try, in words.
max_name_words = 4


[network]
# A plain TCP connect, not an HTTPS request: no TLS handshake, no certificate
# surprises, and much faster.
probe_host = "1.1.1.1"
probe_port = 53
timeout_s = 1.5
# Connectivity is re-checked at most this often, so answering a question never
# waits on a network round trip.
cache_ttl_s = 30.0


[drive]
# The two tracks. A DRV8833 (or L298N) takes four control lines, two per motor:
# direction comes from which of a pair is high, speed from pulsing them.
enabled = true

# PB0..PB3 are the four free, contiguous GPIOs left on the header once I2S has
# taken PB4..PB8 and SPI1 has taken PD10..PD13. They are gpiochip0 lines 32-35,
# because the number is NUM + 32 * letter-index and B is index 1.
#
#   header pin  7  = PB0 = line 32   IN1  left forward
#   header pin 11  = PB1 = line 33   IN2  left backward
#   header pin 29  = PB2 = line 34   IN3  right forward
#   header pin 31  = PB3 = line 35   IN4  right backward
chip = "gpiochip0"

left_forward_line = 32
left_backward_line = 33
right_forward_line = 34
right_backward_line = 35

pwm_hz = 200.0
default_speed = 0.75
# Below roughly a third a small gear motor buzzes and warms without turning,
# so slower requests are clamped up to this.
min_speed = 0.35

# Every movement is time limited. There is no floor sensor on this robot, so a
# bounded run is what stops it driving off the edge of a table.
default_seconds = 1.2
max_seconds = 5.0


[motion]
enabled = true
# Confirm with `gpioinfo`. The chip that carries the 40-pin header is NOT
# always gpiochip0.
chip = "gpiochip1"
frame_hz = 50.0
# Seconds to keep pulsing after a move before going slack. Longer holds the
# pose more firmly; shorter saves battery and stops the servos buzzing.
hold_s = 0.45

# line = the GPIO offset within `chip`, not the physical pin number.
[[motion.servos]]
name = "neck_pan"
line = 15
rest_angle = 90.0

[[motion.servos]]
name = "neck_tilt"
line = 16
rest_angle = 90.0
# Narrow the pulse range on the neck so a bad command cannot drive the head
# into the shell.
min_pulse_us = 900
max_pulse_us = 2100

[[motion.servos]]
name = "left_arm"
line = 17
rest_angle = 90.0

[[motion.servos]]
name = "right_arm"
line = 18
rest_angle = 90.0
